services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # En production, retirer cette publication : la base n'a aucune raison d'être
      # joignable depuis l'extérieur. Pour un accès ponctuel, passer par un tunnel SSH.
      - "${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    # Aucun port publié : Ollama n'a pas d'authentification, exposer 11434 revient à offrir
    # un service d'inférence ouvert à tous. Le backend l'atteint par le réseau interne du
    # compose, sous le nom « ollama ».
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: springboot-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      OLLAMA_URL: http://ollama:11434
      CV_STORAGE_DIR: /data/cvs
    volumes:
      - cvs:/data/cvs

volumes:
  postgres_data:
  cvs:
  ollama_data:
