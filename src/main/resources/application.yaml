spring:
  application:
    name: Skulvi_cv

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # « validate » et non « update » : c'est Flyway qui fait évoluer le schéma, Hibernate se
      # contente de vérifier au démarrage que la base correspond bien aux entités. Une migration
      # oubliée fait échouer le démarrage, au lieu de laisser Hibernate modifier la base d'un
      # client en silence.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # La base de production existe déjà, créée par Hibernate et sans historique de migration.
    # Flyway la marque comme étant à la version 1 et n'applique que les suivantes. Une base
    # vide, elle, déroule toutes les migrations depuis le début.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Schema cree par Hibernate avant Flyway

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB


talent:
  llm:
    provider: ${LLM_PROVIDER:ollama}
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    timeout-seconds: 180

  scoring:
    high-threshold: 80
    review-threshold: 60
    secondary-threshold: 40
    mandatory-missing-cap: 59

  storage:
    dir: ${CV_STORAGE_DIR:./data/cvs}

  queue:
    # Fréquence de réveil du worker d'analyse. Le délai initial laisse à Ollama le temps de
    # démarrer : sans lui, les premières analyses après un redéploiement échouent toutes.
    poll-ms: ${QUEUE_POLL_MS:3000}
    initial-delay-ms: ${QUEUE_INITIAL_DELAY_MS:10000}

  analytics:
    # Purge de la mesure d'audience, chaque nuit à 4 h 30.
    purge-cron: ${ANALYTICS_PURGE_CRON:0 30 4 * * *}


stripe:
  # Faux par défaut : une instance sans compte de paiement doit démarrer normalement, et
  # l'interface propose alors un contact au lieu d'un bouton inopérant.
  enabled: ${STRIPE_ENABLED:false}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-path: ${STRIPE_SUCCESS_PATH:/admin/abonnement?paiement=ok}
  cancel-path: ${STRIPE_CANCEL_PATH:/admin/abonnement?paiement=annule}
  portal-return-path: ${STRIPE_PORTAL_RETURN_PATH:/admin/abonnement}
  # Purge des traces de webhooks deja traites.
  ledger-purge-cron: ${STRIPE_LEDGER_PURGE_CRON:0 15 4 * * *}
  # Identifiants de tarif, un par plan payant. Les clés correspondent aux noms de l'enum
  # Plan en minuscules : c'est ce qui permet au webhook de retrouver le plan d'un abonnement.
  prices:
    starter: ${STRIPE_PRICE_STARTER:}
    pro: ${STRIPE_PRICE_PRO:}
    business: ${STRIPE_PRICE_BUSINESS:}


app:
  # Adresse publique du site, utilisée pour les retours de paiement. En production, le vrai
  # domaine — une adresse locale renverrait le client sur sa propre machine après avoir payé.
  public-url: ${PUBLIC_URL:http://localhost:4200}

  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    # Origines autorisées, séparées par des virgules. Une entrée contenant « * » est traitée
    # comme un motif : « http://localhost:* » couvre tous les ports du serveur de
    # développement. En local, le mandataire Angular rend ce réglage inutile — le front et
    # l'API sont alors sur la même origine.
    cors-origin: ${CORS_ORIGIN:http://localhost:4200,http://localhost:*}


springdoc:
  # Documentation interactive de l'API.
  #
  # Défaut à « false », et c'est le point important : la valeur par défaut d'une exposition
  # doit être « fermé ». Auparavant le défaut était « true », donc une instance dont le
  # fichier d'environnement oublie la variable publiait la description complète de toutes
  # les routes, de tous les paramètres et de tous les corps attendus — soit la carte de la
  # surface d'attaque, offerte sans authentification.
  #
  # En développement, SWAGGER_ENABLED=true est posé dans .env : rien ne change en local.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
